[project]
name = "timetable"
version = "0.1.0"
description = "A click-through, always-on-top interval timer HUD for Windows, built with Qt (no web view)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
timetable = "timetable.app:main"

[tool.setuptools]
packages = ["timetable"]
