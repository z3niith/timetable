[project]
name = "timetable"
version = "0.2.0"
description = "A click-through, always-on-top interval timer HUD for Windows, built with Qt (no web view)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
timetable = "timetable.app:main"

[tool.setuptools]
packages = ["timetable"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Real errors only: syntax problems, undefined names, unused imports/variables.
select = ["E4", "E7", "E9", "F"]
